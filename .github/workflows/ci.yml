name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos
          POSTGRES_DB: agentos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agentos:agentos@localhost:5432/agentos
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: docker pull python:3.12-slim
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: frontend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest versions the dashboard claims to support, and the latest 22.
        node: ["20.19.0", "22.13.0", "22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Runtime dependencies: nothing high or critical. Dev tooling: nothing critical.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical

  # Builds the three images and starts the whole stack exactly as docs/DEPLOY.md does, then
  # checks it from the outside. No LLM is reachable here, so the mission this creates fails at
  # planning; what is proven is everything around it: build, migrate, seed, routing, the login
  # gate, and that the worker can really start a locked-down code container on the host.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway configuration
        run: |
          HASH=$(docker run --rm caddy:2.8-alpine caddy hash-password --plaintext ci-pass)
          cat > .env <<EOF
          POSTGRES_PASSWORD=ci-postgres
          LLM_PROVIDER=openai_compatible
          LLM_MODEL=ci-model
          DOCKER_GID=$(stat -c %g /var/run/docker.sock)
          ADMIN_PASSWORD_HASH='$HASH'
          EOF
      - run: docker compose -f docker-compose.prod.yml config -q
      - run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Wait for the front door
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/health && exit 0
            sleep 3
          done
          echo "stack did not become healthy"; exit 1
      - name: Smoke test
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/missions)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"objective":"x"}' http://localhost:8080/api/v1/missions)" = 401
          code=$(curl -s -o /tmp/m.json -w '%{http_code}' -u admin:ci-pass -X POST -H 'Content-Type: application/json' -d '{"objective":"smoke test"}' http://localhost:8080/api/v1/missions)
          test "$code" = 202
          docker compose -f docker-compose.prod.yml exec -T postgres psql -U agentos -tAc "select count(*) from agents" | grep -qx 3
          out=$(docker compose -f docker-compose.prod.yml exec -T worker docker run --rm --network none python:3.12-slim python -c "print(6*7)")
          test "$out" = 42
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=80
